<!doctype html>
<html>
<head><meta charset="utf-8"><title>WhatsApp reader harness</title></head>
<body>
<!--FIXTURE-->
<script src="file://{{ROOT}}/Extension/whatsapp/reader.js"></script>
<script>
  const { readOpenChat, canonicalChatId } = WorkbenchWhatsApp;
  const read = () => readOpenChat(document);
  const result = { read: read(), replay: read() };
  const pane = document.getElementById("main");
  const row = (id, text) => {
    const made = document.createElement("div");
    made.dataset.id = id;
    made.innerHTML = '<div class="copyable-text"><span class="selectable-text"></span></div>';
    made.querySelector(".selectable-text").textContent = text;
    return made;
  };

  pane.append(row("false_999000000002@c.us_MIXED", "From another chat"));
  result.mixed = read();
  pane.lastElementChild.dataset.id = "unexpected-layout";
  result.unrecognized = read();
  pane.lastElementChild.remove();

  pane.prepend(row("false_919800000001@c.us_HUGE", "x".repeat(20_001)));
  result.bounded = read();
  pane.firstElementChild.remove();

  for (let n = 0; n < 205; n++) pane.append(row(`false_919800000001@c.us_BULK${n}`, `message ${n}`));
  const many = read();
  result.many = { truncated: many.truncated, count: many.messages.length, first: many.messages[0].id, last: many.messages.at(-1).id };
  for (const bulk of [...pane.querySelectorAll('[data-id*="BULK"]')]) bulk.remove();

  pane.replaceChildren(row("false_123456789-1600000000@g.us_GROUPMSG_456@lid", "Group words"));
  result.group = read();

  pane.replaceChildren();
  result.empty = read();
  pane.remove();
  result.noChat = read();
  result.canonical = ["919800000001@c.us", "919800000001@s.whatsapp.net", "123@g.us", "77@lid"].map(canonicalChatId);
  document.documentElement.dataset.out = btoa(JSON.stringify(result));
</script>
</body>
</html>
