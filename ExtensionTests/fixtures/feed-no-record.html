<!-- Structure only: a feed with ARIA roles, no ids, and class names that lie about the structure. -->
<meta name="location" content="https://feed.example/home">
<div role="main">
  <h1>Home feed</h1>
  <ul role="list">
    <li role="listitem"><div>Maya Iyer</div><div>Raised a seed round of 2M.</div></li>
    <li role="listitem"><div>Dev Shah</div><div>Hiring a head of sales.</div></li>
  </ul>
  <table><tr role="row"><td>Row one text</td></tr></table>
  <article>An article body.</article>
  <div class="listitem article heading">Loose text with a misleading name.</div>
  <div style="display:none">Hidden text</div>
  <div style="position:absolute; top:5000px">Far below the screen</div>
  <input value="typed secret">
  <div contenteditable="true">draft in an editor</div>
</div>
